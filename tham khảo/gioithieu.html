<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Travel Tết 2026</title>
    <style>
        /* --- 1. CÀI ĐẶT CƠ BẢN --- */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap');

        :root {
            --primary-red: #8E0E00; /* Đỏ thẫm hoàng gia */
            --secondary-red: #1F1C18;
            --gold: #C5A059;
            --gold-light: #F3E5AB;
            --ease-out-quint: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; /* Khóa cuộn khi chưa mở cửa */
            background: #000;
        }

        /* --- 2. INTRO LAYER (CỬA & MÀN HÌNH CHÀO) --- */
        #intro-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            z-index: 1000;
            perspective: 1500px; /* Tạo chiều sâu 3D */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Cánh cửa */
        .door {
            position: absolute;
            top: 0;
            width: 50%; height: 100%;
            background: linear-gradient(135deg, var(--primary-red), #520800);
            z-index: 2;
            transition: transform 2.5s var(--ease-in-out), box-shadow 2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.7);
        }

        /* Họa tiết chìm trên cửa */
        .door::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.3;
        }

        .door.left { 
            left: 0; 
            transform-origin: left center; /* Xoay từ bản lề trái */
            border-right: 2px solid #330000;
        }
        .door.right { 
            right: 0; 
            transform-origin: right center; /* Xoay từ bản lề phải */
            border-left: 2px solid #330000;
        }

        /* Tay nắm cửa / Huy hiệu giữa */
        .knocker-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            pointer-events: none;
            transition: opacity 1s ease;
        }
        
        .knocker {
            width: 120px; height: 120px;
            background: radial-gradient(circle, var(--gold-light), var(--gold), #8a6e35);
            border-radius: 50%;
            border: 4px solid #4a3b18;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .knocker-half {
            width: 60px; height: 120px;
            overflow: hidden;
            position: relative;
            background: inherit;
        }
        /* Tách huy hiệu làm đôi */
        .door.left .knocker-deco { right: -60px; } 
        .door.right .knocker-deco { left: -60px; }

        /* Nội dung chữ (Welcome Text) */
        .intro-text-wrapper {
            position: absolute;
            z-index: 20;
            text-align: center;
            width: 100%;
        }

        .tet-year {
            font-family: 'Great Vibes', cursive;
            font-size: 6rem;
            color: transparent;
            background: linear-gradient(to bottom, #fff, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 0;
            opacity: 1;
            transform: translateY(0);
            transition: all 1s ease;
        }

        .btn-luxury {
            margin-top: 30px;
            padding: 18px 50px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold);
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--gold);
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }

        .btn-luxury::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn-luxury:hover {
            background: var(--gold);
            color: #2c0500;
            box-shadow: 0 0 30px var(--gold);
        }
        .btn-luxury:hover::before { left: 100%; }

        /* Canvas Particle */
        #particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* --- 3. MAIN SITE (NỘI DUNG CHÍNH) --- */
        #main-content {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1464817739973-0128fe77aaa1?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            z-index: 1;
            /* Ban đầu thu nhỏ và mờ để tạo hiệu ứng Zoom In */
            transform: scale(0.8) translateZ(-200px); 
            filter: blur(10px) brightness(0.5);
            opacity: 0;
            transition: transform 2.5s var(--ease-out-quint), filter 2.5s ease, opacity 1.5s ease;
        }

        .content-overlay {
            width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0; transform: translateY(30px);
            transition: 1s 1s ease; /* Delay hiện chữ */
        }
        
        .main-desc {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.6;
            opacity: 0; transform: translateY(30px);
            transition: 1s 1.2s ease;
        }

        /* --- 4. ANIMATION STATE CLASSES --- */
        
        /* Trạng thái mở cửa */
        body.door-open .door.left {
            transform: rotateY(-110deg); /* Mở rộng hơn 90 độ */
            box-shadow: -10px 0 20px rgba(0,0,0,0.5);
        }
        body.door-open .door.right {
            transform: rotateY(110deg);
            box-shadow: 10px 0 20px rgba(0,0,0,0.5);
        }
        
        body.door-open .intro-text-wrapper {
            opacity: 0;
            transform: scale(1.5); /* Chữ phóng to rồi biến mất */
            pointer-events: none;
        }
        
        body.door-open #main-content {
            opacity: 1;
            transform: scale(1) translateZ(0); /* Zoom vào vị trí chuẩn */
            filter: blur(0) brightness(1);
        }

        body.door-open .main-title, 
        body.door-open .main-desc {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Ánh sáng lóe lên khi mở cửa */
        #flash-light {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 1s ease;
        }
        body.door-open #flash-light {
            animation: flashEffect 1.5s ease-out;
        }

        @keyframes flashEffect {
            0% { opacity: 0; }
            30% { opacity: 0.6; } /* Lóe sáng */
            100% { opacity: 0; }
        }

        @media (max-width: 768px) {
            .tet-year { font-size: 3.5rem; }
            .main-title { font-size: 2.5rem; }
            .knocker { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>

    <div id="flash-light"></div>

    <div id="intro-container">
        <canvas id="particles"></canvas>

        <div class="intro-text-wrapper">
            <h1 class="tet-year">Xuân Bính Ngọ</h1>
            <p style="color: #F3E5AB; letter-spacing: 3px; margin-bottom: 20px; font-size: 0.9rem;">2026 SPECIAL EDITION</p>
            <button class="btn-luxury" onclick="openDoor()">Khám Phá</button>
        </div>

        <div class="door left">
            <div style="position: absolute; right: -40px; top: 50%; transform: translateY(-50%); width: 80px; height: 80px; border: 4px solid #C5A059; border-radius: 50%; background: #8E0E00; z-index: 5; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
                <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #C5A059; font-size: 20px; font-weight: bold; font-family: serif;">PHÚC</div>
            </div>
        </div>

        <div class="door right">
             <div style="position: absolute; left: -40px; top: 50%; transform: translateY(-50%); width: 80px; height: 80px; border: 4px solid #C5A059; border-radius: 50%; background: #8E0E00; z-index: 5; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
                 <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #C5A059; font-size: 20px; font-weight: bold; font-family: serif;">LỘC</div>
            </div>
        </div>
    </div>

    <main id="main-content">
        <div class="content-overlay">
            <h2 class="main-title">Tuyệt Tác Việt Nam</h2>
            <p class="main-desc">Chào đón năm mới 2026 với những hành trình đẳng cấp. Tận hưởng vẻ đẹp di sản và văn hóa trong không gian sang trọng nhất.</p>
        </div>
    </main>

    <script>
        // --- LOGIC MỞ CỬA ---
        function openDoor() {
            // Thêm class vào body để CSS lo phần animation
            document.body.classList.add('door-open');
            
            // Cho phép scroll lại trang sau khi hiệu ứng kết thúc (khoảng 2.5s)
            setTimeout(() => {
                document.body.style.overflow = 'auto';
                document.getElementById('intro-container').style.pointerEvents = 'none'; // Tắt tương tác intro
            }, 2500);
        }

        // --- PARTICLE SYSTEM (HOA & ĐOM ĐÓM) ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let w, h;
        let particles = [];

        const resize = () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.life = Math.random() * 100 + 100;
                this.opacity = Math.random() * 0.5 + 0.2;
                
                // 70% là đom đóm (vàng), 30% là hoa (hồng/đỏ)
                this.type = Math.random() > 0.3 ? 'glow' : 'flower'; 
                this.color = this.type === 'glow' ? `rgba(255, 215, 0,` : `rgba(255, 183, 197,`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;
                
                // Hiệu ứng lung linh cho đom đóm
                if(this.type === 'glow') {
                    this.opacity += (Math.random() - 0.5) * 0.1;
                    if(this.opacity < 0) this.opacity = 0;
                    if(this.opacity > 0.8) this.opacity = 0.8;
                }

                if (this.life <= 0 || this.x < 0 || this.x > w || this.y < 0 || this.y > h) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                if (this.type === 'glow') {
                    // Đom đóm có hiệu ứng tỏa sáng (shadow)
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#FFD700';
                    ctx.fillStyle = this.color + this.opacity + ')';
                } else {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = this.color + this.opacity + ')';
                }
                
                ctx.fill();
                ctx.shadowBlur = 0; // Reset shadow
            }
        }

        function initParticles() {
            for(let i=0; i<80; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();

    </script>
</body>
</html>
