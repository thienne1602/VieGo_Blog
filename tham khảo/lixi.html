<div id="lucky-wrapper">
    <div class="lucky-btn" onclick="openLuckyMoney()">
        <div class="lucky-icon">🧧</div>
        <div class="lucky-tooltip">Nhận Lì Xì</div>
    </div>

    <div class="lucky-modal" id="luckyModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeLuckyMoney()">&times;</span>
            <div class="modal-header">CHÚC MỪNG NĂM MỚI</div>
            <div class="modal-body">
                <p>Bạn nhận được mã giảm giá:</p>
                <h2 class="discount-code">TET2026</h2>
                <p>Giảm <strong>500.000đ</strong> cho đơn hàng đầu tiên</p>
                <button class="btn-copy" onclick="copyCode()">Sao Chép Mã</button>
            </div>
            <div class="firework left">💥</div>
            <div class="firework right">💥</div>
        </div>
    </div>
</div>

<style>
    /* CSS CHO LÌ XÌ */
    #lucky-wrapper {
        font-family: 'Montserrat', sans-serif;
    }

    /* Nút Lì Xì ở góc */
    .lucky-btn {
        position: fixed;
        bottom: 30px; right: 30px;
        width: 70px; height: 70px;
        background: #D4AF37; /* Vàng */
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 9999;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        animation: shake 2s infinite; /* Hiệu ứng rung */
    }

    .lucky-icon {
        font-size: 35px;
    }

    .lucky-tooltip {
        position: absolute;
        bottom: 80px;
        background: #fff;
        color: #b71c1c;
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: bold;
        white-space: nowrap;
        opacity: 0;
        transition: 0.3s;
        pointer-events: none;
    }
    .lucky-btn:hover .lucky-tooltip { opacity: 1; bottom: 85px; }

    /* Animation Rung Lắc */
    @keyframes shake {
        0% { transform: rotate(0deg); }
        5% { transform: rotate(15deg); }
        10% { transform: rotate(-15deg); }
        15% { transform: rotate(15deg); }
        20% { transform: rotate(0deg); }
        100% { transform: rotate(0deg); } /* Nghỉ một chút rồi rung tiếp */
    }

    /* Modal Popup */
    .lucky-modal {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        z-index: 10000;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
    }

    .lucky-modal.active {
        opacity: 1;
        pointer-events: auto;
    }

    .modal-content {
        background: linear-gradient(135deg, #b71c1c, #8E0E00);
        width: 90%; max-width: 400px;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        color: #fff;
        border: 2px solid #D4AF37;
        position: relative;
        transform: scale(0.5);
        transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Hiệu ứng nảy */
    }

    .lucky-modal.active .modal-content { transform: scale(1); }

    .modal-header {
        font-family: 'Cinzel', serif;
        font-size: 1.8rem;
        color: #FFD700;
        margin-bottom: 20px;
    }

    .discount-code {
        background: #fff;
        color: #b71c1c;
        padding: 10px;
        border-radius: 10px;
        border: 2px dashed #b71c1c;
        margin: 20px 0;
        font-size: 2rem;
    }

    .btn-copy {
        background: #FFD700;
        color: #b71c1c;
        border: none;
        padding: 10px 30px;
        border-radius: 50px;
        font-weight: bold;
        cursor: pointer;
        font-size: 1.1rem;
        transition: 0.3s;
    }
    .btn-copy:hover { background: #fff; }

    .close-btn {
        position: absolute;
        top: 10px; right: 20px;
        font-size: 30px;
        cursor: pointer;
        color: rgba(255,255,255,0.5);
    }
    .close-btn:hover { color: #fff; }
    
    .firework { position: absolute; font-size: 30px; animation: pop 1s infinite alternate; }
    .firework.left { top: -20px; left: -20px; }
    .firework.right { top: -20px; right: -20px; }
    
    @keyframes pop { from {transform: scale(1);} to {transform: scale(1.5);} }

</style>

<script>
    // JS XỬ LÝ MODAL
    const modal = document.getElementById('luckyModal');

    function openLuckyMoney() {
        modal.classList.add('active');
        // Tạo hiệu ứng pháo giấy (Confetti) nếu muốn
    }

    function closeLuckyMoney() {
        modal.classList.remove('active');
    }

    function copyCode() {
        navigator.clipboard.writeText("TET2026");
        const btn = document.querySelector('.btn-copy');
        btn.innerText = "Đã Sao Chép!";
        setTimeout(() => { btn.innerText = "Sao Chép Mã"; }, 2000);
    }
    
    // Đóng khi click ra ngoài
    window.onclick = function(event) {
        if (event.target == modal) {
            closeLuckyMoney();
        }
    }
</script>
